 <!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyUz</title>
  <link rel="icon" type="image/png" href="./img/skyuz-icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <style>
      /* Tema almashganda 45 gradusli diagonal parda effekti, tepadan pastga */
      ::view-transition-old(root) {
        animation: none;
      }
      ::view-transition-new(root) {
        animation: sky-theme-wipe 1.5s ease-in-out forwards;
        -webkit-mask-image: linear-gradient(135deg, #000 50%, transparent 50%);
        mask-image: linear-gradient(135deg, #000 50%, transparent 50%);
        -webkit-mask-size: 260% 260%;
        mask-size: 260% 260%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }
      @keyframes sky-theme-wipe {
        from { -webkit-mask-position: 0% -160%; mask-position: 0% -160%; }
        to   { -webkit-mask-position: 0% 160%;  mask-position: 0% 160%; }
      }
    </style>

</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">

<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 pt-[env(safe-area-inset-top,0px)]">
  <div class="max-w-3xl mx-auto flex items-center justify-between gap-3 px-4 py-3">
    <div class="font-extrabold text-lg text-blue-600 dark:text-blue-400">✈️ SkyUz</div>
    <div class="flex items-center gap-2 flex-wrap">

      <button id="themeBtn" class="border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">🌓</button>
      <button id="authBtn" class="hidden bg-transparent border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"></button>
    </div>
  </div>
</header>

<!-- Registration modal -->

          <div class="relative flex-none">
            <button type="button" id="codeToggle" class="font-semibold text-sm px-3 py-2 whitespace-nowrap hover:bg-slate-100 dark:hover:bg-slate-700 rounded-l-lg">🇺🇿 +998</button>
            <div id="codeMenu" class="hidden absolute top-full left-0 mt-1 min-w-[230px] max-h-56 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-xl z-50 p-1"></div>
          </div>
          <input id="regPhone" placeholder="90 123 45 67" class="flex-1 bg-transparent px-3 py-2 min-w-0">
        </div>
      </div>
    </div>
    <button id="regBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg px-4 py-2"></button>
    <div id="authMsg" class="hidden mt-3 text-sm rounded-lg px-3 py-2 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300"></div>
